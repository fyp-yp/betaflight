<div class="tab-setup">
    <div class="content_wrapper">
        <!-- should be the first DIV on each tab -->
        <div class="tab_title" i18n="tabSetup" style="display: none;">Setup</div>
        <div class="cf_doc_version_bt" style="display: none;">
            <a id="button-documentation" href="" target="_blank"></a>
        </div>
        <div class="grid-row">
            <div class="grid-col col2">
                <div class="default_btn">
                    <div id="accel_calib_rest">
                        <a class="calibrateAccel" id="default_btn green" href="#" i18n="initialSetupButtonCalibrateAccel"></a>
                    </div>
                    <div id="accel_calib_running">
                        <div class="data-loading-setup">
                            <p i18n="initialSetupButtonCalibratingText"></p>
                        </div>
                    </div>
                </div>
                <div class="default_btn">
                    <div id="gyro_data_rest">
                        <a class="gyroDataTest" id="default_btn green" href="#" i18n="测试陀螺仪"></a>
                    </div>
                    <div id="gyro_data_running">
                        <div class="data-loading-setup">
                            <p i18n="请轻微晃动陀螺仪…"></p>
                        </div>
                    </div>
                </div>
                <div class="default_btn">
                    <div id="receiver_rest">
                        <a class="receiverTest" id="default_btn green" href="#" i18n="测试遥控器"></a>
                    </div>
                    <div id="receiver_running">
                        <div class="data-loading-setup">
                            <p i18n="请操作遥控器…"></p>
                        </div>
                    </div>
                </div>
                <div class="gui_box grey">
                    <input id="motorsEnableTestMode" type="checkbox" class="togglesmall"/>
                    <span class="motorsEnableTestMode" i18n="motorsEnableControl"></span>
                </div>
            </div>
            <div class="grid-col col4 model-and-info">
                <div id="interactive_block">
                    <div id="canvas_wrapper" class="background_paper">
                        <canvas id="canvas"></canvas>
                        <div class="attitude_info">
                            <dl>
                                <dt>Heading:</dt>
                                <dd class="heading">&nbsp;</dd>
                                <dt>Pitch:</dt>
                                <dd class="pitch">&nbsp;</dd>
                                <dt>Roll:</dt>
                                <dd class="roll">&nbsp;</dd>
                            </dl>
                        </div>
                    </div>
                    <a class="reset sm-min" href="#" i18n="initialSetupButtonResetZaxis"></a>
                </div>
            </div>
        </div>
        <div class="grid-row" style="display: none;">
            <div class="grid-col col3">
                <div class="default_btn">
                    <div id="mag_calib_rest">
                        <a class="calibrateMag" href="#" i18n="initialSetupButtonCalibrateMag"></a>
                    </div>
                    <div id="mag_calib_running">
                        <div class="data-loading-setup">
                            <p i18n="initialSetupButtonCalibratingText"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="grid-col col9">
                <div class="cell_setup">
                    <span i18n="initialSetupCalibrateMagText"></span>
                </div>
            </div>
        </div>
        <div class="grid-row" style="display: none;">
            <div class="grid-col col3">
                <div class="default_btn">
                    <a class="resetSettings" href="#" i18n="initialSetupButtonReset"></a>
                </div>
            </div>
            <div class="grid-col col9">
                <div class="cell_setup">
                    <span i18n="initialSetupResetText"></span>
                </div>
            </div>
        </div>
        <div class="grid-row" style="display: none;">
            <div class="grid-col col3">
                <div class="default_btn initialSetupRebootBootloader">
                    <a class="rebootBootloader" href="#" i18n="initialSetupButtonRebootBootloader"></a>
                </div>
            </div>
            <div class="grid-col col9">
                <div class="cell_setup initialSetupRebootBootloader">
                    <span i18n="initialSetupRebootBootloaderText"></span>
                </div>
            </div>
        </div>
        <div class="modelwrapper"></div>
        <div class="grid-row">
            <div class="grid-col col5">
                <div class="gui_box grey">
                    <div class="gui_box_titlebar">
                        <div class="spacer_box_title" i18n="测试项目"></div>
                    </div>
                    <div class="spacer_box">
                        <table width="100%" border="0" cellpadding="0" cellspacing="0" class="cf_table">
                            <tbody>
                                <tr>
                                    <td i18n="序列号" class="cf_tip"></td>
                                    <td class="deviceIdentifier"></td>
                                </tr>
                                <tr>
                                    <td i18n="固件" class="cf_tip"></td>
                                    <td class="versionLabelFirmware"></td>
                                </tr>
                                <tr>
                                    <td i18n="品牌" class="cf_tip"></td>
                                    <td class="boardName"></td>
                                </tr>
                                <tr>
                                    <td i18n="编译时间" class="cf_tip"></td>
                                    <td class="buildInfo"></td>
                                </tr>
                                <tr>
                                    <td i18n="电池电压"></td>
                                    <td class="batteryVoltage">0 V</td>
                                </tr>
                                <tr>
                                    <td i18n="黑匣子"></td>
                                    <td class="flashFree"></td>
                                </tr>
                                <tr>
                                    <td i18n="电调协议"></td>
                                    <td class="protocolName"></td>
                                </tr>
                                <tr>
                                    <td i18n="电机"></td>
                                    <td class="testMotor"></td>
                                </tr>
                                <tr>
                                    <td i18n="3D定位"></td>
                                    <td class="gpsFix"></td>
                                </tr>
                                <tr>
                                    <td i18n="卫星数"></td>
                                    <td class="gpsSats"></td>
                                </tr>
                                <tr>
                                    <td i18n="遥控器"></td>
                                    <td class="testReceiver"></td>
                                </tr>
                                <tr>
                                    <td i18n="加速度计"></td>
                                    <td class="testAccel"></td>
                                </tr>
                                <tr>
                                    <td i18n="加速度校准"></td>
                                    <td class="testAccelCali"></td>
                                </tr>
                                <tr>
                                    <td i18n="陀螺仪"></td>
                                    <td class="testGyro"></td>
                                </tr>
                                <tr>
                                    <td i18n="陀螺仪数据"></td>
                                    <td class="testGyroData"></td>
                                </tr>
                                <tr>
                                    <td i18n="气压计"></td>
                                    <td class="testBaro"></td>
                                </tr>
                                <tr>
                                    <td i18n="磁力仪"></td>
                                    <td class="testMag"></td>
                                </tr>
                                <tr>
                                    <td i18n="声呐"></td>
                                    <td class="testSonar"></td>
                                </tr>
                                <tr class="noboarder">
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="gui_box grey" style="display:none">
                    <div class="gui_box_titlebar">
                        <div class="spacer_box_title" i18n="statusbar_port_utilization"></div>
                    </div>
                    <div class="spacer_box">
                        <table width="100%" border="0" cellpadding="0" cellspacing="0" class="cf_table">
                            <tbody>
                            <tr>
                                <td i18n="statusbar_usage_upload" class="cf_tip"></td>
                                <td class="usageUp-text"></td>
                            </tr>
                            <tr>
                                <td i18n="statusbar_usage_download" class="cf_tip"></td>
                                <td class="usageDown-text"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="gui_box grey" style="display:none">
                    <div class="gui_box_titlebar">
                        <div class="spacer_box_title" i18n="statusbar_cpu_load"></div>
                    </div>
                    <div class="spacer_box">
                        <div class="cpuLoad-text"></div>
                    </div>
                </div>
            </div>
            <div class="grid-col col3" style="display: none;">
                <div class="gui_box grey">
                    <div class="gui_box_titlebar">
                        <div class="spacer_box_title" i18n="initialSetupInfoHead"></div>
                    </div>
                    <div class="spacer_box">
                        <table width="100%" border="0" cellpadding="0" cellspacing="0" class="cf_table">
                            <tbody>
                            <tr>
                                <td id="arming-disable-flag" i18n="initialSetupArmingDisableFlags" class="cf_tip"></td>
                                <td class="arming-disable-flags"></td>
                            </tr>
                            <tr>
                                <td i18n="initialSetupBattery"></td>
                                <td class="bat-voltage">0 V</td>
                            </tr>
                            <tr>
                                <td i18n="initialSetupDrawn"></td>
                                <td class="bat-mah-drawn">0 mAh</td>
                            </tr>
                            <tr>
                                <td i18n="initialSetupDrawing"></td>
                                <td class="bat-mah-drawing">0.00 A</td>
                            </tr>
                            <tr class="noboarder">
                                <td i18n="initialSetupRSSI"></td>
                                <td class="rssi">0 %</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="gui_box grey instrumentsbox" align="center">
                    <div class="gui_box_titlebar" align="left">
                        <div class="spacer_box_title" i18n="initialSetupInstrumentsHead"></div>
                    </div>
                    <span id="attitude"></span> <span id="heading"></span>
                </div>
                <div class="gui_box grey backupRestore">
                    <div class="gui_box_titlebar">
                        <div class="spacer_box_title" i18n="initialSetupBackupRestoreHeader"></div>
                    </div>
                    <div class="spacer_box">
                        <div class="default_btn">
                            <a class="backup" href="#" i18n="initialSetupButtonBackup"></a>
                        </div>
                        <div class="default_btn">
                            <a class="restore" href="#" i18n="initialSetupButtonRestore"></a>
                        </div>
                        <div class="cell_setup">
                            <span i18n="initialSetupBackupRestoreText"></span>
                        </div>    
                    </div>
                </div>
            </div>
        </div>
        <div class="grid-row">
            <div class="grid-col col6 bars">
                <!-- <div class="gui_box grey tunings topspacer">
                    <table class="pid_titlebar">
                        <thead>
                        <tr>
                            <th i18n="receiverModelPreview"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td class="model_preview_cell">
                                <div class="model_preview background_paper">
                                    <canvas id="canvas"></canvas>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div> -->
            </div>
        </div>
    </div>

    <dialog class="dialogConfirmReset">
        <h3 i18n="dialogConfirmResetTitle"></h3>
        <div class="content">
            <div i18n="dialogConfirmResetNote" style="margin-top: 10px"></div>
        </div>
        <div class="buttons">
            <a href="#" class="dialogConfirmReset-confirmbtn danger-button" i18n="dialogConfirmResetConfirm"></a>
            <a href="#" class="dialogConfirmReset-cancelbtn regular-button" i18n="dialogConfirmResetClose"></a>
        </div>
    </dialog>

</div>
